table:
  name: v_leave_summary
  schema: public
select_permissions:
- role: hr
  permission:
    columns:
    - leave_type
    - status
    - requests
    - days
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    allow_aggregations: true
- role: director
  permission:
    columns:
    - leave_type
    - status
    - requests
    - days
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    allow_aggregations: true
- role: bff_service
  permission:
    columns:
    - leave_type
    - status
    - requests
    - days
    - tenant_id
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    allow_aggregations: true
- role: tenant_api_read
  permission:
    columns:
    - leave_type
    - status
    - requests
    - days
    - tenant_id
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    allow_aggregations: true
    limit: 1000
- role: tenant_api_write
  permission:
    columns:
    - leave_type
    - status
    - requests
    - days
    - tenant_id
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    allow_aggregations: true
    limit: 1000
