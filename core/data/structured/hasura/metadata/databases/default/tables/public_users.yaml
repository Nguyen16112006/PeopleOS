table:
  name: users
  schema: public
select_permissions:
- role: employee
  permission:
    columns:
    - id
    - username
    - email
    - full_name
    - role
    - is_active
    - created_at
    filter:
      _and:
      - tenant_id:
          _eq: X-Hasura-Tenant-Id
      - id:
          _eq: X-Hasura-User-Id
    allow_aggregations: true
- role: manager
