insert_permissions:
- role: bff_service
  permission:
    check:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    set:
      tenant_id: X-Hasura-Tenant-Id
    columns:
    - id
    - username
    - email
    - full_name
    - role
    - is_active
    - created_at
    backend_only: false
update_permissions:
- role: bff_service
