table:
  name: payrolls
  schema: public
object_relationships:
- name: employee
  using:
    foreign_key_constraint_on: employee_id
select_permissions:
- role: employee
  permission:
    columns:
    - id
    - employee_id
    - period_year
    - period_month
    - base_salary
    - allowance
    - overtime_pay
    - bonus
    - gross
    - insured_salary
    - bhxh_employee
    - bhyt_employee
    - bhtn_employee
    - taxable_income
    - personal_income_tax
    - net_salary
    - status
    - paid_at
    - file_key
    filter:
      _and:
      - tenant_id:
          _eq: X-Hasura-Tenant-Id
      - _and:
        - employee:
            user_id:
              _eq: X-Hasura-User-Id
        - status:
            _eq: paid
    allow_aggregations: true
