table:
  name: notifications
  schema: public
object_relationships:
- name: user
  using:
    foreign_key_constraint_on: user_id
select_permissions:
- role: employee
  permission:
    columns:
    - id
    - user_id
    - title
    - message
    - ref_type
    - ref_id
    - is_read
    - created_at
    filter:
      _and:
      - tenant_id:
          _eq: X-Hasura-Tenant-Id
      - user_id:
          _eq: X-Hasura-User-Id
    allow_aggregations: true
