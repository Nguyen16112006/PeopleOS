table:
  name: kpi_cycles
  schema: public
select_permissions:
- role: employee
  permission:
    columns: &id001
    - id
    - name
    - year
    - quarter
    - start_date
    - end_date
    - status
    - created_by
    - created_at
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    allow_aggregations: true
- role: manager
  permission:
    columns: *id001
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    allow_aggregations: true
- role: hr
  permission:
    columns: *id001
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    allow_aggregations: true
- role: director
  permission:
    columns: *id001
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    allow_aggregations: true
- role: accountant
  permission:
    columns: *id001
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    allow_aggregations: true
- role: sysadmin
  permission:
    columns: *id001
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    allow_aggregations: true
- role: bff_service
  permission:
    columns:
    - id
    - name
    - year
    - quarter
    - start_date
    - end_date
    - status
    - created_by
    - created_at
    - tenant_id
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    allow_aggregations: true
- role: tenant_api_read
  permission:
    columns:
    - id
    - name
    - year
    - quarter
    - start_date
    - end_date
    - status
    - created_by
    - created_at
    - tenant_id
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    allow_aggregations: true
    limit: 1000
- role: tenant_api_write
  permission:
    columns:
    - id
    - name
    - year
    - quarter
    - start_date
    - end_date
    - status
    - created_by
    - created_at
    - tenant_id
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    allow_aggregations: true
    limit: 1000
insert_permissions:
- role: bff_service
  permission:
    check:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    set:
      tenant_id: X-Hasura-Tenant-Id
    columns:
    - id
    - name
    - year
    - quarter
    - start_date
    - end_date
    - status
    - created_by
    - created_at
    backend_only: false
- role: tenant_api_write
  permission:
    check:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    set:
      tenant_id: X-Hasura-Tenant-Id
    columns:
    - id
    - name
    - year
    - quarter
    - start_date
    - end_date
    - status
    - created_by
    - created_at
    backend_only: false
