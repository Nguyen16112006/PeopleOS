table:
  name: kpi_evaluations
  schema: public
object_relationships:
- name: employee
  using:
    foreign_key_constraint_on: employee_id
- name: cycle
  using:
    foreign_key_constraint_on: cycle_id
- name: evaluator
  using:
    foreign_key_constraint_on: evaluator_id
select_permissions:
- role: employee
  permission:
    columns: &id001
    - id
    - cycle_id
    - employee_id
    - evaluator_id
    - goal_scores
    - score
    - rating
    - comment
    - status
    - employee_feedback
    - feedback_at
    - created_at
    - updated_at
    filter:
      _and:
      - tenant_id:
          _eq: X-Hasura-Tenant-Id
      - &id002
        _and:
        - employee:
            user_id:
              _eq: X-Hasura-User-Id
        - status:
            _eq: approved
    allow_aggregations: true
- role: manager
  permission:
    columns: *id001
    filter:
      _and:
      - tenant_id:
          _eq: X-Hasura-Tenant-Id
      - _or:
        - employee:
            manager:
              user_id:
                _eq: X-Hasura-User-Id
        - *id002
    allow_aggregations: true
- role: hr
  permission:
    columns: *id001
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    allow_aggregations: true
- role: director
  permission:
    columns: *id001
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    allow_aggregations: true
- role: accountant
  permission:
    columns: *id001
    filter:
      _and:
      - tenant_id:
          _eq: X-Hasura-Tenant-Id
      - *id002
    allow_aggregations: true
- role: sysadmin
  permission:
    columns: *id001
    filter:
      _and:
      - tenant_id:
          _eq: X-Hasura-Tenant-Id
      - *id002
    allow_aggregations: true
- role: bff_service
  permission:
    columns:
    - id
    - cycle_id
    - employee_id
    - evaluator_id
    - goal_scores
    - score
    - rating
    - comment
    - status
    - employee_feedback
    - feedback_at
    - created_at
    - updated_at
    - tenant_id
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    allow_aggregations: true
- role: tenant_api_read
  permission:
    columns:
    - id
    - cycle_id
    - employee_id
    - evaluator_id
    - goal_scores
    - score
    - rating
    - comment
    - status
    - employee_feedback
    - feedback_at
    - created_at
    - updated_at
    - tenant_id
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    allow_aggregations: true
    limit: 1000
- role: tenant_api_write
  permission:
    columns:
    - id
    - cycle_id
    - employee_id
    - evaluator_id
    - goal_scores
    - score
    - rating
    - comment
    - status
    - employee_feedback
    - feedback_at
    - created_at
    - updated_at
    - tenant_id
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    allow_aggregations: true
    limit: 1000
insert_permissions:
- role: bff_service
  permission:
    check:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    set:
      tenant_id: X-Hasura-Tenant-Id
    columns:
    - id
    - cycle_id
    - employee_id
    - evaluator_id
    - goal_scores
    - score
    - rating
    - comment
    - status
    - employee_feedback
    - feedback_at
    - created_at
    - updated_at
    backend_only: false
- role: tenant_api_write
  permission:
    check:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    set:
      tenant_id: X-Hasura-Tenant-Id
    columns:
    - id
    - cycle_id
    - employee_id
    - evaluator_id
    - goal_scores
    - score
    - rating
    - comment
    - status
    - employee_feedback
    - feedback_at
    - created_at
    - updated_at
    backend_only: false
update_permissions:
- role: bff_service
  permission:
    columns:
    - cycle_id
    - employee_id
    - evaluator_id
    - goal_scores
    - score
    - rating
    - comment
    - status
    - employee_feedback
    - feedback_at
    - created_at
    - updated_at
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    check:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
- role: tenant_api_write
  permission:
    columns:
    - cycle_id
    - employee_id
    - evaluator_id
    - goal_scores
    - score
    - rating
    - comment
    - status
    - employee_feedback
    - feedback_at
    - created_at
    - updated_at
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    check:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
delete_permissions:
- role: bff_service
  permission:
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
- role: tenant_api_write
  permission:
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
