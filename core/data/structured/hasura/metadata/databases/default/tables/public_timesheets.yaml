    - status
    - submitted_at
    - confirmed_by
    - confirmed_at
    - review_note
    - closed_at
    - created_at
    - updated_at
    filter:
      _and:
      - tenant_id:
          _eq: X-Hasura-Tenant-Id
      - _or:
        - *id001
        - employee:
            manager:
              user_id:
                _eq: X-Hasura-User-Id
    allow_aggregations: true
