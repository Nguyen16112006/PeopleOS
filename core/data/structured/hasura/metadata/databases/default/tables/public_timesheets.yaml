table:
  name: timesheets
  schema: public
object_relationships:
- name: employee
  using:
    foreign_key_constraint_on: employee_id
- name: confirmer
  using:
    foreign_key_constraint_on: confirmed_by
select_permissions:
- role: employee
  permission:
    columns:
    - id
    - employee_id
    - period_year
    - period_month
    - standard_days
    - work_days
    - paid_leave_days
    - holiday_days
    - unpaid_leave_days
    - absent_days
    - ot_weekday_hours
    - ot_weekend_hours
    - ot_holiday_hours
    - status
    - submitted_at
    - confirmed_by
    - confirmed_at
    - review_note
    - closed_at
    - created_at
    - updated_at
    filter:
      _and:
      - tenant_id:
          _eq: X-Hasura-Tenant-Id
      - &id001
        employee:
          user_id:
            _eq: X-Hasura-User-Id
    allow_aggregations: true
- role: sysadmin
  permission:
    columns:
    - id
    - employee_id
    - period_year
    - period_month
    - standard_days
    - work_days
    - paid_leave_days
    - holiday_days
    - unpaid_leave_days
    - absent_days
    - ot_weekday_hours
    - ot_weekend_hours
    - ot_holiday_hours
    - status
    - submitted_at
    - confirmed_by
    - confirmed_at
    - review_note
    - closed_at
    - created_at
    - updated_at
    filter:
      _and:
      - tenant_id:
          _eq: X-Hasura-Tenant-Id
      - *id001
    allow_aggregations: true
- role: manager
  permission:
    columns:
    - id
    - employee_id
    - period_year
    - period_month
