table:
  name: tax_certificates
  schema: public
object_relationships:
- name: employee
  using:
    foreign_key_constraint_on: employee_id
select_permissions:
- role: employee
  permission:
    columns: &id001
    - id
    - year
    - employee_id
    - months
    - gross_total
    - insurance_total
    - taxable_total
    - pit_withheld
    - net_total
    - dependents
    - tax_code
    - issued_at
    filter:
      _and:
      - tenant_id:
          _eq: X-Hasura-Tenant-Id
      - &id002
        employee:
          user_id:
            _eq: X-Hasura-User-Id
    allow_aggregations: true
- role: manager
  permission:
    columns: *id001
    filter:
      _and:
      - tenant_id:
          _eq: X-Hasura-Tenant-Id
      - *id002
    allow_aggregations: true
- role: hr
  permission:
    columns: *id001
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    allow_aggregations: true
- role: director
  permission:
    columns: *id001
    filter:
      _and:
      - tenant_id:
          _eq: X-Hasura-Tenant-Id
      - *id002
    allow_aggregations: true
- role: accountant
  permission:
    columns: *id001
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    allow_aggregations: true
- role: sysadmin
  permission:
    columns: *id001
    filter:
      _and:
      - tenant_id:
          _eq: X-Hasura-Tenant-Id
      - *id002
    allow_aggregations: true
- role: bff_service
  permission:
    columns:
    - id
    - year
    - employee_id
    - months
    - gross_total
    - insurance_total
    - taxable_total
    - pit_withheld
    - net_total
    - dependents
    - tax_code
    - issued_at
    - tenant_id
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    allow_aggregations: true
- role: tenant_api_read
  permission:
    columns:
    - id
    - year
    - employee_id
    - months
    - gross_total
    - insurance_total
    - taxable_total
    - pit_withheld
    - net_total
    - dependents
    - tax_code
    - issued_at
    - tenant_id
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    allow_aggregations: true
    limit: 1000
- role: tenant_api_write
  permission:
    columns:
    - id
    - year
    - employee_id
    - months
    - gross_total
    - insurance_total
    - taxable_total
    - pit_withheld
    - net_total
    - dependents
    - tax_code
    - issued_at
    - tenant_id
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    allow_aggregations: true
    limit: 1000
insert_permissions:
- role: bff_service
  permission:
    check:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    set:
      tenant_id: X-Hasura-Tenant-Id
    columns:
    - id
    - year
    - employee_id
    - months
    - gross_total
    - insurance_total
    - taxable_total
    - pit_withheld
    - net_total
    - dependents
    - tax_code
    - issued_at
    backend_only: false
- role: tenant_api_write
  permission:
    check:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    set:
      tenant_id: X-Hasura-Tenant-Id
    columns:
    - id
    - year
    - employee_id
    - months
    - gross_total
    - insurance_total
    - taxable_total
    - pit_withheld
    - net_total
    - dependents
    - tax_code
    - issued_at
    backend_only: false
update_permissions:
- role: bff_service
  permission:
    columns:
    - year
    - employee_id
    - months
    - gross_total
    - insurance_total
    - taxable_total
    - pit_withheld
    - net_total
    - dependents
    - tax_code
    - issued_at
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    check:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
- role: tenant_api_write
  permission:
    columns:
    - year
    - employee_id
    - months
    - gross_total
    - insurance_total
    - taxable_total
    - pit_withheld
    - net_total
    - dependents
    - tax_code
    - issued_at
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    check:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
delete_permissions:
- role: bff_service
  permission:
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
- role: tenant_api_write
  permission:
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
