# SPDX-License-Identifier: Apache-2.0
table:
  name: payslip_complaints
  schema: public
object_relationships:
- name: employee
  using:
    foreign_key_constraint_on: employee_id
- name: payroll
  using:
    foreign_key_constraint_on: payroll_id
select_permissions:
- role: employee
  permission:
    columns: &id001
    - id
    - payroll_id
    - employee_id
    - message
    - status
    - hr_note
    - hr_handled_by
    - adjustment_note
    - adjusted_by
    - created_at
    - updated_at
    filter: &id002
      employee:
        user_id:
          _eq: X-Hasura-User-Id
    allow_aggregations: true
- role: manager
  permission:
    columns: *id001
    filter: *id002
    allow_aggregations: true
- role: hr
  permission:
    columns: *id001
    filter: {}
    allow_aggregations: true
- role: director
  permission:
    columns: *id001
    filter: *id002
    allow_aggregations: true
- role: accountant
  permission:
    columns: *id001
    filter:
      status:
        _in:
        - adjusting
        - resolved
    allow_aggregations: true
- role: sysadmin
  permission:
    columns: *id001
    filter: *id002
    allow_aggregations: true
