table:
  name: hr_budgets
  schema: public
select_permissions:
- role: hr
  permission:
    columns: &id001
    - year
    - payroll_fund
    - headcount_plan
    - note
    - status
    - proposed_by
    - approved_by
    - approved_at
    - updated_at
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    allow_aggregations: true
- role: accountant
  permission:
    columns: *id001
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    allow_aggregations: true
- role: director
  permission:
    columns: *id001
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    allow_aggregations: true
- role: bff_service
  permission:
    columns:
    - year
    - payroll_fund
    - headcount_plan
    - note
    - status
    - proposed_by
    - approved_by
    - approved_at
    - updated_at
    - tenant_id
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    allow_aggregations: true
- role: tenant_api_read
  permission:
    columns:
    - year
    - payroll_fund
    - headcount_plan
    - note
    - status
    - proposed_by
    - approved_by
    - approved_at
    - updated_at
    - tenant_id
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    allow_aggregations: true
    limit: 1000
- role: tenant_api_write
  permission:
    columns:
    - year
    - payroll_fund
    - headcount_plan
    - note
    - status
    - proposed_by
    - approved_by
    - approved_at
    - updated_at
    - tenant_id
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    allow_aggregations: true
    limit: 1000
insert_permissions:
- role: bff_service
  permission:
    check:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    set:
      tenant_id: X-Hasura-Tenant-Id
    columns:
    - year
    - payroll_fund
    - headcount_plan
    - note
    - status
    - proposed_by
    - approved_by
    - approved_at
    - updated_at
    backend_only: false
- role: tenant_api_write
  permission:
    check:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    set:
      tenant_id: X-Hasura-Tenant-Id
    columns:
    - year
    - payroll_fund
    - headcount_plan
    - note
    - status
    - proposed_by
    - approved_by
    - approved_at
    - updated_at
    backend_only: false
update_permissions:
- role: bff_service
  permission:
    columns:
    - year
    - payroll_fund
    - headcount_plan
    - note
    - status
    - proposed_by
    - approved_by
    - approved_at
    - updated_at
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    check:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
- role: tenant_api_write
  permission:
    columns:
    - year
    - payroll_fund
    - headcount_plan
    - note
    - status
    - proposed_by
    - approved_by
    - approved_at
    - updated_at
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    check:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
delete_permissions:
- role: bff_service
  permission:
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
- role: tenant_api_write
  permission:
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
