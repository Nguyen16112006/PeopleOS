insert_permissions:
- role: bff_service
  permission:
    check:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    set:
      tenant_id: X-Hasura-Tenant-Id
    columns:
    - id
    - employee_id
    - proposer_id
    - proposal_type
    - current_amount
    - proposed_amount
    - reason
    - effective_date
    - status
    - created_at
    - updated_at
    backend_only: false
- role: tenant_api_write
