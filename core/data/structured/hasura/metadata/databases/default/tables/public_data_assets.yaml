- role: bff_service
  permission:
    columns:
    - name
    - asset_type
    - system
    - layer
    - classification
    - owner
    - description
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    check:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
- role: tenant_api_write
  permission:
    columns:
    - name
    - asset_type
    - system
    - layer
    - classification
    - owner
    - description
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    check:
