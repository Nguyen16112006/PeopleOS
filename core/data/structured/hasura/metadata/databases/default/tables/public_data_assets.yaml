table:
  name: data_assets
  schema: public
select_permissions:
- role: hr
  permission:
    columns:
    - id
    - name
    - asset_type
    - system
    - layer
    - classification
    - owner
    - description
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    allow_aggregations: true
- role: director
  permission:
    columns:
    - id
    - name
    - asset_type
    - system
    - layer
    - classification
    - owner
    - description
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    allow_aggregations: true
- role: sysadmin
  permission:
    columns:
    - id
    - name
    - asset_type
    - system
    - layer
    - classification
    - owner
    - description
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    allow_aggregations: true
- role: bff_service
  permission:
    columns:
    - id
    - name
    - asset_type
    - system
    - layer
    - classification
    - owner
    - description
    - tenant_id
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    allow_aggregations: true
- role: tenant_api_read
  permission:
    columns:
    - id
    - name
    - asset_type
    - system
    - layer
    - classification
    - owner
    - description
    - tenant_id
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    allow_aggregations: true
    limit: 1000
- role: tenant_api_write
  permission:
    columns:
    - id
    - name
    - asset_type
    - system
    - layer
    - classification
    - owner
    - description
    - tenant_id
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    allow_aggregations: true
    limit: 1000
insert_permissions:
- role: bff_service
  permission:
    check:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    set:
      tenant_id: X-Hasura-Tenant-Id
    columns:
    - id
    - name
    - asset_type
    - system
    - layer
    - classification
    - owner
    - description
    backend_only: false
- role: tenant_api_write
  permission:
    check:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    set:
      tenant_id: X-Hasura-Tenant-Id
    columns:
    - id
    - name
    - asset_type
    - system
    - layer
    - classification
    - owner
    - description
    backend_only: false
