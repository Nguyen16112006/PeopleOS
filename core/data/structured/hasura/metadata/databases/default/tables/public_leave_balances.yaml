table:
  name: leave_balances
  schema: public
object_relationships:
- name: employee
  using:
    foreign_key_constraint_on: employee_id
select_permissions:
- role: employee
  permission:
    columns:
    - id
    - employee_id
    - year
    - entitled_days
    - used_days
    - sick_days_used
    filter:
      _and:
      - tenant_id:
          _eq: X-Hasura-Tenant-Id
      - employee:
          user_id:
            _eq: X-Hasura-User-Id
    allow_aggregations: true
- role: manager
  permission:
    columns:
    - id
    - employee_id
    - year
    - entitled_days
    - used_days
    - sick_days_used
    filter:
      _and:
      - tenant_id:
          _eq: X-Hasura-Tenant-Id
      - _or:
        - employee:
            user_id:
              _eq: X-Hasura-User-Id
        - employee:
            manager:
              user_id:
                _eq: X-Hasura-User-Id
    allow_aggregations: true
- role: hr
  permission:
    columns:
    - id
    - employee_id
    - year
    - entitled_days
    - used_days
    - sick_days_used
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    allow_aggregations: true
- role: director
  permission:
    columns:
    - id
    - employee_id
    - year
    - entitled_days
    - used_days
    - sick_days_used
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    allow_aggregations: true
- role: accountant
  permission:
    columns:
    - id
    - employee_id
    - year
    - entitled_days
    - used_days
    - sick_days_used
    filter:
      _and:
      - tenant_id:
          _eq: X-Hasura-Tenant-Id
      - employee:
          user_id:
            _eq: X-Hasura-User-Id
    allow_aggregations: true
- role: sysadmin
  permission:
    columns:
    - id
    - employee_id
    - year
    - entitled_days
    - used_days
    - sick_days_used
    filter:
      _and:
      - tenant_id:
          _eq: X-Hasura-Tenant-Id
      - employee:
          user_id:
            _eq: X-Hasura-User-Id
    allow_aggregations: true
- role: bff_service
  permission:
    columns:
    - id
    - employee_id
    - year
    - entitled_days
    - used_days
    - sick_days_used
    - tenant_id
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    allow_aggregations: true
- role: tenant_api_read
  permission:
    columns:
    - id
    - employee_id
    - year
    - entitled_days
    - used_days
    - sick_days_used
    - tenant_id
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    allow_aggregations: true
    limit: 1000
- role: tenant_api_write
  permission:
    columns:
    - id
    - employee_id
    - year
    - entitled_days
    - used_days
    - sick_days_used
    - tenant_id
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    allow_aggregations: true
    limit: 1000
insert_permissions:
- role: bff_service
  permission:
    check:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    set:
      tenant_id: X-Hasura-Tenant-Id
    columns:
    - id
    - employee_id
    - year
    - entitled_days
    - used_days
    - sick_days_used
    backend_only: false
- role: tenant_api_write
  permission:
    check:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    set:
      tenant_id: X-Hasura-Tenant-Id
    columns:
    - id
    - employee_id
    - year
    - entitled_days
    - used_days
    - sick_days_used
    backend_only: false
