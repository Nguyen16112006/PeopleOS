# SPDX-License-Identifier: Apache-2.0
table:
  name: kpi_goals
  schema: public
object_relationships:
- name: employee
  using:
    foreign_key_constraint_on: employee_id
- name: cycle
  using:
    foreign_key_constraint_on: cycle_id
select_permissions:
- role: employee
  permission:
    columns: &id001
    - id
    - cycle_id
    - employee_id
    - title
    - description
    - target
    - weight
    - created_by
    - created_at
    filter: &id002
      employee:
        user_id:
          _eq: X-Hasura-User-Id
    allow_aggregations: true
- role: manager
  permission:
    columns: *id001
    filter:
      _or:
      - *id002
      - employee:
          manager:
            user_id:
              _eq: X-Hasura-User-Id
    allow_aggregations: true
- role: hr
  permission:
    columns: *id001
    filter: {}
    allow_aggregations: true
- role: director
  permission:
    columns: *id001
    filter: {}
    allow_aggregations: true
- role: accountant
  permission:
    columns: *id001
    filter: *id002
    allow_aggregations: true
- role: sysadmin
  permission:
    columns: *id001
    filter: *id002
    allow_aggregations: true
