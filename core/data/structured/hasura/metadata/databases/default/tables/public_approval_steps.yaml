table:
  name: approval_steps
  schema: public
object_relationships:
- name: proposal
  using:
    foreign_key_constraint_on: proposal_id
- name: approver
  using:
    foreign_key_constraint_on: approver_id
select_permissions:
- role: manager
  permission:
    columns:
    - id
    - proposal_id
    - step_order
    - approver_role
    - status
    - approver_id
    - comment
    - decided_at
    filter:
      _and:
      - tenant_id:
          _eq: X-Hasura-Tenant-Id
      - proposal:
          proposer:
            user_id:
              _eq: X-Hasura-User-Id
    allow_aggregations: true
- role: hr
  permission:
    columns:
    - id
    - proposal_id
    - step_order
    - approver_role
    - status
    - approver_id
    - comment
    - decided_at
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    allow_aggregations: true
- role: director
  permission:
    columns:
    - id
    - proposal_id
    - step_order
    - approver_role
    - status
    - approver_id
    - comment
    - decided_at
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    allow_aggregations: true
- role: accountant
  permission:
    columns:
    - id
    - proposal_id
    - step_order
    - approver_role
    - status
    - approver_id
    - comment
    - decided_at
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    allow_aggregations: true
- role: bff_service
  permission:
    columns:
    - id
    - proposal_id
    - step_order
    - approver_role
    - status
    - approver_id
    - comment
    - decided_at
    - tenant_id
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    allow_aggregations: true
- role: tenant_api_read
  permission:
    columns:
    - id
    - proposal_id
    - step_order
    - approver_role
    - status
    - approver_id
    - comment
    - decided_at
    - tenant_id
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    allow_aggregations: true
    limit: 1000
- role: tenant_api_write
  permission:
    columns:
    - id
    - proposal_id
    - step_order
    - approver_role
    - status
    - approver_id
    - comment
    - decided_at
    - tenant_id
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    allow_aggregations: true
    limit: 1000
insert_permissions:
- role: bff_service
  permission:
    check:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    set:
      tenant_id: X-Hasura-Tenant-Id
    columns:
    - id
    - proposal_id
    - step_order
    - approver_role
    - status
    - approver_id
    - comment
    - decided_at
    backend_only: false
- role: tenant_api_write
  permission:
    check:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    set:
      tenant_id: X-Hasura-Tenant-Id
    columns:
    - id
    - proposal_id
    - step_order
    - approver_role
    - status
    - approver_id
    - comment
    - decided_at
    backend_only: false
update_permissions:
- role: bff_service
  permission:
    columns:
    - proposal_id
    - step_order
    - approver_role
    - status
    - approver_id
    - comment
    - decided_at
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    check:
