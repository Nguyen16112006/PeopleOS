        _eq: X-Hasura-Tenant-Id
- role: tenant_api_write
  permission:
    columns:
    - proposal_id
    - step_order
    - approver_role
    - status
    - approver_id
    - comment
    - decided_at
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    check:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
delete_permissions:
- role: bff_service
  permission:
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
- role: tenant_api_write
