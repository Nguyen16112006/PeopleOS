table:
  name: approval_steps
  schema: public
object_relationships:
- name: proposal
  using:
    foreign_key_constraint_on: proposal_id
- name: approver
  using:
    foreign_key_constraint_on: approver_id
select_permissions:
- role: manager
  permission:
    columns:
    - id
    - proposal_id
    - step_order
    - approver_role
    - status
    - approver_id
    - comment
    - decided_at
    filter:
      proposal:
        proposer:
          user_id:
            _eq: X-Hasura-User-Id
    allow_aggregations: true
- role: hr
  permission:
    columns:
    - id
    - proposal_id
    - step_order
    - approver_role
    - status
    - approver_id
    - comment
    - decided_at
    filter: {}
    allow_aggregations: true
