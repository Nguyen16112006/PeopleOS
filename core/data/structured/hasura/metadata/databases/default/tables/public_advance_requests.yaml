table:
  name: advance_requests
  schema: public
object_relationships:
- name: employee
  using:
    foreign_key_constraint_on: employee_id
select_permissions:
- role: employee
  permission:
    columns: &id001
    - id
    - employee_id
    - request_type
    - amount
    - reason
    - receipt_keys
    - stage
    - status
    - paid_at
    - settled_amount
    - settled_at
    - created_at
    - updated_at
    filter: &id002
      employee:
        user_id:
          _eq: X-Hasura-User-Id
- role: manager
  permission:
    columns: *id001
    filter:
      _or:
      - employee:
          user_id:
            _eq: X-Hasura-User-Id
      - employee:
          manager:
            user_id:
              _eq: X-Hasura-User-Id
- role: hr
  permission:
    columns: *id001
    filter: *id002
- role: accountant
  permission:
    columns: *id001
    filter: {}
    allow_aggregations: true
- role: director
  permission:
    columns: *id001
    filter: {}
    allow_aggregations: true
- role: sysadmin
  permission:
    columns: *id001
    filter: *id002
