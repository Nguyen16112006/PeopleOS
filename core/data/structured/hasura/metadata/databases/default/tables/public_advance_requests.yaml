table:
  name: advance_requests
  schema: public
object_relationships:
- name: employee
  using:
    foreign_key_constraint_on: employee_id
select_permissions:
- role: employee
  permission:
    columns: &id001
    - id
    - employee_id
    - request_type
    - amount
    - reason
    - receipt_keys
    - stage
    - status
    - paid_at
    - settled_amount
    - settled_at
    - created_at
    - updated_at
    filter:
      _and:
      - tenant_id:
          _eq: X-Hasura-Tenant-Id
      - &id002
        employee:
          user_id:
            _eq: X-Hasura-User-Id
- role: manager
  permission:
    columns: *id001
    filter:
      _and:
      - tenant_id:
          _eq: X-Hasura-Tenant-Id
      - _or:
        - employee:
            user_id:
              _eq: X-Hasura-User-Id
        - employee:
            manager:
              user_id:
                _eq: X-Hasura-User-Id
- role: hr
  permission:
    columns: *id001
    filter:
      _and:
      - tenant_id:
          _eq: X-Hasura-Tenant-Id
      - *id002
- role: accountant
  permission:
    columns: *id001
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    allow_aggregations: true
- role: director
  permission:
    columns: *id001
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    allow_aggregations: true
- role: sysadmin
  permission:
    columns: *id001
    filter:
      _and:
      - tenant_id:
          _eq: X-Hasura-Tenant-Id
      - *id002
- role: bff_service
  permission:
    columns:
    - id
    - employee_id
    - request_type
    - amount
    - reason
    - receipt_keys
    - stage
    - status
    - paid_at
    - settled_amount
    - settled_at
    - created_at
    - updated_at
    - tenant_id
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    allow_aggregations: true
- role: tenant_api_read
  permission:
    columns:
    - id
    - employee_id
    - request_type
    - amount
    - reason
    - receipt_keys
    - stage
    - status
    - paid_at
    - settled_amount
    - settled_at
    - created_at
    - updated_at
    - tenant_id
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    allow_aggregations: true
    limit: 1000
- role: tenant_api_write
  permission:
    columns:
    - id
    - employee_id
    - request_type
    - amount
    - reason
    - receipt_keys
    - stage
    - status
    - paid_at
    - settled_amount
    - settled_at
    - created_at
    - updated_at
    - tenant_id
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    allow_aggregations: true
    limit: 1000
insert_permissions:
- role: bff_service
  permission:
    check:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    set:
      tenant_id: X-Hasura-Tenant-Id
    columns:
    - id
    - employee_id
    - request_type
    - amount
    - reason
    - receipt_keys
    - stage
    - status
    - paid_at
    - settled_amount
    - settled_at
    - created_at
    - updated_at
    backend_only: false
- role: tenant_api_write
  permission:
    check:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    set:
      tenant_id: X-Hasura-Tenant-Id
    columns:
    - id
    - employee_id
    - request_type
    - amount
    - reason
    - receipt_keys
    - stage
    - status
    - paid_at
    - settled_amount
    - settled_at
    - created_at
    - updated_at
    backend_only: false
update_permissions:
- role: bff_service
  permission:
    columns:
    - employee_id
    - request_type
    - amount
    - reason
    - receipt_keys
    - stage
    - status
    - paid_at
    - settled_amount
    - settled_at
    - created_at
    - updated_at
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    check:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
- role: tenant_api_write
  permission:
    columns:
    - employee_id
    - request_type
    - amount
    - reason
    - receipt_keys
    - stage
    - status
    - paid_at
    - settled_amount
    - settled_at
    - created_at
    - updated_at
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    check:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
delete_permissions:
- role: bff_service
  permission:
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
- role: tenant_api_write
  permission:
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
