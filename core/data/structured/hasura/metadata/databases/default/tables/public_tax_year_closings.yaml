table:
  name: tax_year_closings
  schema: public
select_permissions:
- role: hr
  permission:
    columns: &id001
    - year
    - status
    - hr_confirmed_by
    - hr_confirmed_at
    - settled_by
    - settled_at
    - certificates_issued
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    allow_aggregations: true
- role: accountant
  permission:
    columns: *id001
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    allow_aggregations: true
- role: director
  permission:
    columns: *id001
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    allow_aggregations: true
- role: bff_service
  permission:
    columns:
    - year
    - status
    - hr_confirmed_by
    - hr_confirmed_at
    - settled_by
    - settled_at
    - certificates_issued
    - tenant_id
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    allow_aggregations: true
- role: tenant_api_read
  permission:
    columns:
    - year
    - status
    - hr_confirmed_by
    - hr_confirmed_at
    - settled_by
    - settled_at
    - certificates_issued
    - tenant_id
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    allow_aggregations: true
    limit: 1000
- role: tenant_api_write
  permission:
    columns:
    - year
    - status
    - hr_confirmed_by
    - hr_confirmed_at
    - settled_by
    - settled_at
    - certificates_issued
    - tenant_id
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    allow_aggregations: true
    limit: 1000
insert_permissions:
- role: bff_service
  permission:
    check:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    set:
      tenant_id: X-Hasura-Tenant-Id
    columns:
    - year
    - status
    - hr_confirmed_by
    - hr_confirmed_at
    - settled_by
    - settled_at
    - certificates_issued
    backend_only: false
- role: tenant_api_write
  permission:
    check:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    set:
      tenant_id: X-Hasura-Tenant-Id
    columns:
    - year
    - status
    - hr_confirmed_by
    - hr_confirmed_at
    - settled_by
    - settled_at
    - certificates_issued
    backend_only: false
update_permissions:
- role: bff_service
  permission:
    columns:
    - year
    - status
    - hr_confirmed_by
    - hr_confirmed_at
    - settled_by
    - settled_at
    - certificates_issued
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    check:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
- role: tenant_api_write
  permission:
    columns:
    - year
    - status
    - hr_confirmed_by
    - hr_confirmed_at
    - settled_by
    - settled_at
    - certificates_issued
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    check:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
delete_permissions:
- role: bff_service
  permission:
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
- role: tenant_api_write
  permission:
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
