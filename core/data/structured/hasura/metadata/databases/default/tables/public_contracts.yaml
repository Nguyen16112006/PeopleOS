table:
  name: contracts
  schema: public
object_relationships:
- name: employee
  using:
    foreign_key_constraint_on: employee_id
select_permissions:
- role: employee
  permission:
    columns:
    - id
    - employee_id
    - contract_no
    - contract_type
    - start_date
    - end_date
    - base_salary
    - allowance
    - status
    - file_key
    - created_at
    filter:
      _and:
      - tenant_id:
          _eq: X-Hasura-Tenant-Id
      - employee:
          user_id:
            _eq: X-Hasura-User-Id
    allow_aggregations: true
- role: manager
  permission:
    columns:
    - id
    - employee_id
    - contract_no
    - contract_type
    - start_date
