table:
  name: contracts
  schema: public
object_relationships:
- name: employee
  using:
    foreign_key_constraint_on: employee_id
select_permissions:
- role: employee
  permission:
    columns:
    - id
    - employee_id
    - contract_no
    - contract_type
    - start_date
    - end_date
    - base_salary
    - allowance
    - status
    - file_key
    - created_at
    filter:
      employee:
        user_id:
          _eq: X-Hasura-User-Id
    allow_aggregations: true
- role: manager
  permission:
    columns:
    - id
    - employee_id
    - contract_no
    - contract_type
    - start_date
    - end_date
    - base_salary
    - allowance
    - status
    - file_key
    - created_at
    filter:
      employee:
        user_id:
          _eq: X-Hasura-User-Id
    allow_aggregations: true
- role: hr
  permission:
    columns:
    - id
    - employee_id
    - contract_no
    - contract_type
    - start_date
    - end_date
    - base_salary
    - allowance
    - status
    - file_key
    - created_at
    filter: {}
    allow_aggregations: true
