table:
  name: v_contracts_expiring
  schema: public
select_permissions:
- role: hr
  permission:
    columns:
    - id
    - contract_no
    - full_name
    - department
    - contract_type
    - end_date
    - days_left
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    allow_aggregations: true
- role: director
  permission:
    columns:
    - id
    - contract_no
    - full_name
    - department
    - contract_type
    - end_date
    - days_left
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    allow_aggregations: true
- role: bff_service
  permission:
    columns:
    - id
    - contract_no
    - full_name
    - department
    - contract_type
    - end_date
    - days_left
    - tenant_id
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    allow_aggregations: true
- role: tenant_api_read
  permission:
    columns:
    - id
    - contract_no
    - full_name
    - department
    - contract_type
    - end_date
    - days_left
    - tenant_id
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    allow_aggregations: true
    limit: 1000
- role: tenant_api_write
  permission:
    columns:
    - id
    - contract_no
    - full_name
    - department
    - contract_type
    - end_date
    - days_left
    - tenant_id
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    allow_aggregations: true
    limit: 1000
