table:
  name: onboarding_tasks
  schema: public
object_relationships:
- name: employee
  using:
    foreign_key_constraint_on: employee_id
select_permissions:
- role: employee
  permission:
    columns:
    - id
    - employee_id
    - title
    - assignee_role
    - status
    - due_date
    - completed_at
    filter:
      employee:
        user_id:
          _eq: X-Hasura-User-Id
    allow_aggregations: true
- role: manager
  permission:
    columns:
    - id
    - employee_id
    - title
    - assignee_role
    - status
    - due_date
    - completed_at
    filter:
      _or:
      - employee:
          user_id:
            _eq: X-Hasura-User-Id
      - employee:
          manager:
            user_id:
              _eq: X-Hasura-User-Id
    allow_aggregations: true
- role: hr
  permission:
    columns:
    - id
    - employee_id
    - title
    - assignee_role
    - status
    - due_date
    - completed_at
    filter: {}
    allow_aggregations: true
