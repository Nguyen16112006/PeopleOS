table:
  name: offboarding_cases
  schema: public
object_relationships:
- name: employee
  using:
    foreign_key_constraint_on: employee_id
select_permissions:
- role: employee
  permission:
    columns: &id001
    - id
    - employee_id
    - kind
    - reason
    - proposed_last_day
    - last_working_day
    - stage
    - status
    - initiated_by
    - final_pay_amount
    - account_locked_at
    - created_at
    - updated_at
    filter: &id002
      employee:
        user_id:
          _eq: X-Hasura-User-Id
    allow_aggregations: true
- role: manager
  permission:
    columns: *id001
    filter:
      _or:
      - *id002
      - employee:
          manager:
            user_id:
              _eq: X-Hasura-User-Id
    allow_aggregations: true
- role: hr
  permission:
    columns: *id001
    filter: {}
    allow_aggregations: true
- role: director
  permission:
    columns: *id001
    filter: {}
    allow_aggregations: true
- role: accountant
  permission:
    columns: *id001
    filter:
      stage:
        _in:
        - final_payroll
        - director_payroll
        - payment
        - terminate
        - done
    allow_aggregations: true
- role: sysadmin
  permission:
    columns: *id001
    filter:
      stage:
        _eq: done
    allow_aggregations: true
