table:
  name: v_headcount_by_department
  schema: public
select_permissions:
- role: hr
  permission:
    columns:
    - department
    - headcount
    - avg_base_salary
    - total_base_salary
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    allow_aggregations: true
- role: director
  permission:
    columns:
    - department
    - headcount
    - avg_base_salary
    - total_base_salary
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    allow_aggregations: true
- role: bff_service
  permission:
    columns:
    - department
    - headcount
    - avg_base_salary
    - total_base_salary
    - tenant_id
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    allow_aggregations: true
- role: tenant_api_read
  permission:
    columns:
    - department
    - headcount
    - avg_base_salary
    - total_base_salary
    - tenant_id
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    allow_aggregations: true
    limit: 1000
- role: tenant_api_write
  permission:
    columns:
    - department
    - headcount
    - avg_base_salary
    - total_base_salary
    - tenant_id
    filter:
      tenant_id:
        _eq: X-Hasura-Tenant-Id
    allow_aggregations: true
    limit: 1000
