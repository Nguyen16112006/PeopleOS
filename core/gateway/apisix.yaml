  # --- AI Assistant (RAG) -----------------------------------------------
  - id: ai
    uri: /ai/*
    methods: [GET, POST, OPTIONS]
    plugin_config_id: secured
    plugins:
      proxy-rewrite:
        regex_uri: ["^/ai/(.*)", "/$1"]
    upstream:
      type: roundrobin
      nodes:
        "rag-service:8001": 1
      timeout:
        connect: 5
        send: 120
        read: 120

  # --- WebSocket realtime ---------------------------------------------
  # Trình duyệt không gửi được header Authorization khi mở WebSocket,
  # nên token được truyền qua query ?token=... và BFF xác thực chữ ký JWT.
  - id: realtime
    uri: /ws
    enable_websocket: true
    upstream:
      type: roundrobin
      nodes:
        "bff:8000": 1
