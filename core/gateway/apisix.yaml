# =====================================================================
# Định tuyến API Gateway của PeopleOS (APISIX standalone)
# - Mọi route nghiệp vụ đều bắt buộc Bearer JWT do Keycloak phát hành
#   (plugin openid-connect, bearer_only, kiểm chữ ký bằng JWKS).
# - /api/internal/* bị chặn ở gateway (chỉ n8n gọi trực tiếp trong mạng Docker).
# - Một số nhóm API có lớp kiểm tra vai trò ở gateway (xem các route guard-*); /graphql chặn vai trò "admin".
# - Nếu truy cập frontend từ origin khác http://localhost:3000, sửa allow_origins.
# =====================================================================
plugin_configs:
  - id: secured
    plugins:
      cors:
        allow_origins: "http://localhost:3000"
        allow_methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
        allow_headers: "Authorization,Content-Type,x-hasura-role"
        expose_headers: "Content-Disposition"
        max_age: 3600
      openid-connect:
        client_id: people-workspace
        client_secret: not-used-in-bearer-only-mode
        discovery: http://keycloak:8080/realms/peopleos/.well-known/openid-configuration
        bearer_only: true
        use_jwks: true
        realm: peopleos
        scope: openid
        token_signing_alg_values_expected: RS256

routes:
  # --- Chặn API nội bộ ----------------------------------------------
  - id: block-internal
    uri: /api/internal/*
    priority: 100
    plugins:
      fault-injection:
        abort:
          http_status: 404
          body: "Not Found"
    upstream:
      type: roundrobin
      nodes:
        "bff:8000": 1

  # --- Dữ liệu cấu trúc: GraphQL (Hasura) -----------------------------
  - id: graphql
    uri: /graphql
    methods: [GET, POST, OPTIONS]
    plugin_config_id: secured
    plugins:
      proxy-rewrite:
        uri: /v1/graphql
      serverless-post-function:
        phase: access
        functions:
          - |
            return function(conf, ctx)
              local core = require("apisix.core")
              local role = core.request.header(ctx, "x-hasura-role")
              if role and string.lower(role) == "admin" then
                return 403, { message = "Vai trò 'admin' (siêu quyền Hasura) không được phép qua gateway" }
              end
            end
    upstream:
      type: roundrobin
      nodes:
        "hasura:8080": 1

  # =====================================================================
  # Lớp bảo vệ theo vai trò (phòng thủ nhiều lớp): gateway kiểm tra claim
  # realm_access.roles trong JWT đã được openid-connect xác thực chữ ký, rồi
  # từ chối sớm (403) nếu vai trò không thuộc danh sách. Phân quyền chi tiết
  # vẫn do BFF và Hasura quyết định.
  # =====================================================================
  # Thuế, báo cáo năm, ngân sách: chỉ HR, Kế toán, Giám đốc
  - id: guard-tax-year
    uris:
      - /api/tax-year/*
    methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
    priority: 10
    plugin_config_id: secured
    plugins:
      serverless-post-function:
        phase: access
        functions:
          - |
            return function(conf, ctx)
              local core = require("apisix.core")
              local allowed = { hr = true, accountant = true, director = true }
              if ngx.req.get_method() == "OPTIONS" then return end   -- preflight CORS không mang token
              local auth = core.request.header(ctx, "Authorization") or ""
              local token = auth:match("^[Bb]earer%s+(.+)$")
              if not token then return 401, { message = "Thiếu Bearer token" } end
              local payload = token:match("^[^.]+%.([^.]+)%.")
              if not payload then return 401, { message = "Token không hợp lệ" } end
              payload = payload:gsub("%-", "+"):gsub("_", "/")
              local pad = #payload % 4
              if pad > 0 then payload = payload .. string.rep("=", 4 - pad) end
              local decoded = ngx.decode_base64(payload)
              local claims = decoded and core.json.decode(decoded)
              local roles = claims and claims.realm_access and claims.realm_access.roles or {}
              for _, r in ipairs(roles) do
                if allowed[r] then return end
              end
              return 403, { message = "Vai trò của bạn không được phép gọi API này" }
            end
    upstream:
      type: roundrobin
      nodes:
        "bff:8000": 1
      timeout:
        connect: 5
        send: 60
        read: 60

