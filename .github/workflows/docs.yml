# Build trang tài liệu API (website/) và đăng lên GitHub Pages.
name: docs

on:
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/docs.yml']
  pull_request:
    paths: ['website/**', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: website } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build          # thất bại nếu có link hỏng
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with: { path: website/build }

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deployment.outputs.page_url }}' }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
