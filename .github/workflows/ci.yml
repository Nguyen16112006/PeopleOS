# CI của PeopleOS - mọi thay đổi vào Git (nguồn sự thật của GitOps) đều phải qua các kiểm tra này trước khi hợp nhất.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-tests:
    name: Test Python (tính lương, RAG) + seed khớp mã sinh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest fastapi httpx qdrant-client langchain-text-splitters
      - run: cd core/shared/python && PYTHONPATH=. python -m pytest -q tests
      - run: cd ai/rag-service && python -m pytest -q tests
      - name: seed.sql phải trùng với generate_seed.py
        run: python core/data/structured/seed/generate_seed.py | diff - core/data/structured/seed/seed.sql

  backend-java:
    name: Build + test backend Java
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: mvn -B -f apps/people-workspace/bff/pom.xml verify

  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/people-workspace/frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: apps/people-workspace/frontend/package-lock.json }
      - run: npm ci
      - run: npm run build

  database:
    name: Migration + seed + kiểm tra chuỗi kiểm toán
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: ci, POSTGRES_DB: peopleos }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ci
      PGDATABASE: peopleos
    steps:
      - uses: actions/checkout@v4
      - name: Áp dụng migration theo thứ tự
        run: |
          for f in core/data/structured/hasura/migrations/default/*/up.sql; do echo "== $f"; psql -v ON_ERROR_STOP=1 -q -f "$f"; done
      - run: psql -v ON_ERROR_STOP=1 -q -f core/data/structured/seed/seed.sql
      - name: Chuỗi kiểm toán phải toàn vẹn (0 bản ghi hỏng)
        run: test "$(psql -At -f scripts/audit-verify.sql | tail -1)" = "0"
      - name: Nhật ký phải bất biến
        run: |
          if psql -q -c "UPDATE audit_logs SET action = 'X' WHERE seq = 1" 2>/dev/null; then echo "LỖI: sửa được nhật ký"; exit 1; fi
          if psql -q -c "TRUNCATE audit_logs" 2>/dev/null; then echo "LỖI: truncate được nhật ký"; exit 1; fi
      - name: Sao lưu và khôi phục thử
        run: |
          pg_dump -Fc peopleos -f /tmp/p.dump
          createdb restore_check && pg_restore -d restore_check --no-owner /tmp/p.dump
          test "$(psql -At -d restore_check -f scripts/audit-verify.sql | tail -1)" = "0"

  config-validation:
    name: Kiểm tra cấu hình (Compose, YAML, JSON, shell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp infrastructure/.env.example infrastructure/.env && docker compose -f infrastructure/docker-compose.yml config -q
      - name: YAML và JSON phải hợp lệ
        run: |
          pip install pyyaml
          python - <<'PY'
          import glob, json, yaml
          for f in glob.glob("core/**/*.yaml", recursive=True) + glob.glob("infrastructure/*.yml"): yaml.safe_load(open(f))
          for f in glob.glob("core/**/*.json", recursive=True): json.load(open(f))
          print("YAML/JSON hop le")
          PY
      - run: shellcheck -S warning scripts/*.sh scripts/backup/*.sh scripts/gitops/*.sh infrastructure/monitoring/*.sh

  docker-build:
    name: Build image
    runs-on: ubuntu-latest
    needs: [python-tests, backend-java, frontend]
    strategy:
      matrix:
        include:
          - { name: bff, file: apps/people-workspace/bff/Dockerfile, context: . }
          - { name: rag-service, file: ai/rag-service/Dockerfile, context: . }
          - { name: frontend, file: apps/people-workspace/frontend/Dockerfile, context: apps/people-workspace/frontend }
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f ${{ matrix.file }} -t peopleos/${{ matrix.name }}:ci ${{ matrix.context }}
