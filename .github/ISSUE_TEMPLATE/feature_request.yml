name: Đề xuất tính năng
description: Đề xuất cải tiến hoặc tính năng mới
title: "[Đề xuất] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Vấn đề cần giải quyết
      description: Ai gặp khó khăn gì? (vd. developer HR-PaaS cần ...)
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Giải pháp đề xuất
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Phương án đã cân nhắc
  - type: checkboxes
    id: checks
    attributes:
      label: Xác nhận
      options:
        - label: Giải pháp tương thích giấy phép OSI (xem docs/LICENSING.md)
        - label: Tôi sẵn sàng tham gia thực hiện hoặc kiểm thử
