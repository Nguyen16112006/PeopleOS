# Cấu hình backend - mọi giá trị đọc từ biến môi trường (xem infrastructure/docker-compose.yml)
server:
  port: 8000

spring:
  application:
    name: peopleos-bff
  jackson:
    property-naming-strategy: SNAKE_CASE      # JSON dùng snake_case, khớp frontend và Hasura
    default-property-inclusion: always
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

springdoc:
  swagger-ui:
    path: /swagger-ui.html

peopleos:
  hasura:
    url: ${HASURA_URL:http://hasura:8080/v1/graphql}
    admin-secret: ${HASURA_ADMIN_SECRET:hasura_admin_secret_change_me}
  jwt:
    jwks-url: ${JWKS_URL:http://keycloak:8080/realms/peopleos/protocol/openid-connect/certs}
    issuer: ${JWT_ISSUER:http://localhost:8080/realms/peopleos}
  keycloak:
    url: ${KEYCLOAK_URL:http://keycloak:8080}
    realm: ${KEYCLOAK_REALM:peopleos}
    admin-user: ${KEYCLOAK_ADMIN:admin}
    admin-password: ${KEYCLOAK_ADMIN_PASSWORD:admin_change_me}
  nats:
    url: ${NATS_URL:nats://nats:4222}
  n8n:
    webhook-base: ${N8N_WEBHOOK_BASE:http://n8n:5678/webhook}
  minio:
    endpoint: ${MINIO_ENDPOINT:minio:9000}
    access-key: ${MINIO_ACCESS_KEY:peopleos_minio}
    secret-key: ${MINIO_SECRET_KEY:peopleos_minio_secret}
  clamav:
    enabled: ${CLAMAV_ENABLED:true}
    host: ${CLAMAV_HOST:clamav}
    port: ${CLAMAV_PORT:3310}
    timeout-ms: ${CLAMAV_TIMEOUT_MS:30000}
    fail-open: ${CLAMAV_FAIL_OPEN:false}
  internal-api-key: ${INTERNAL_API_KEY:internal_key_change_me}
  cors:
    enabled: ${ENABLE_CORS:false}
    frontend-url: ${FRONTEND_URL:http://localhost:3000}

logging:
  level:
    vn.peopleos: INFO
