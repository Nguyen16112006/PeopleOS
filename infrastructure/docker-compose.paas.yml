# =====================================================================
# Lớp PaaS chạy chồng lên docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.paas.yml --env-file .env up -d
# Thêm: etcd + Valkey (APISIX động, quota), platform-api (control plane), platform-worker (giao webhook),
#       apisix-bootstrap (nạp route/consumer-group), và nối Hasura Event Trigger -> platform-api.
# Sau khi Keycloak lên: python3 scripts/keycloak-paas-bootstrap.py (một lần, idempotent).
#
# LƯU Ý DEV: Hasura trong compose gốc kết nối bằng role superuser => RLS (lớp 2) bị bỏ qua; lớp 1
# (filter tenant trong permission Hasura) vẫn có hiệu lực. Production: Hasura dùng role hasura_app.
# =====================================================================
services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    command:
      - etcd
      - --name=etcd0
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
    volumes:
      - etcd_data:/etcd-data
    restart: unless-stopped

  valkey:        # thay Redis (Redis 7.4+ không còn giấy phép OSI); Valkey: BSD-3-Clause, tương thích giao thức Redis
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]   # bộ đếm quota chỉ cần tạm thời
    restart: unless-stopped

  apisix:
    volumes:
      - ../core/gateway/config.paas.yaml:/usr/local/apisix/conf/config.yaml:ro   # thay config standalone
    environment:
      APISIX_ADMIN_KEY: ${APISIX_ADMIN_KEY:-change_me_admin_key}
      APISIX_KEYRING: ${APISIX_KEYRING:-edd1c9f0985e76a2}
      HASURA_ADMIN_SECRET: ${HASURA_ADMIN_SECRET:-hasura_admin_secret_change_me}
    depends_on:
      - etcd
      - valkey

  apisix-bootstrap:
    image: python:3.12-slim
    working_dir: /repo
    volumes:
      - ..:/repo:ro
    environment:
      APISIX_ADMIN_URL: http://apisix:9180
      APISIX_ADMIN_KEY: ${APISIX_ADMIN_KEY:-change_me_admin_key}
      REDIS_HOST: valkey
      PORTAL_ORIGIN: ${PORTAL_ORIGIN:-http://localhost:3100}
      EVENT_DISPATCHER_SECRET: ${EVENT_DISPATCHER_SECRET:-event_secret_change_me}   # bật đo đếm sử dụng (http-logger)
      PLATFORM_API_UPSTREAM: platform-api:8090
    command: ["sh", "-c", "pip install -q pyyaml && until python scripts/apisix-paas-bootstrap.py; do echo 'APISIX chưa sẵn sàng, thử lại...'; sleep 3; done"]
    depends_on:
      - apisix
    restart: "no"

  platform-api:
    build:
      context: ../apps/platform/platform-api
    environment: &platform-env
      # DEV: dùng role owner. PRODUCTION: role riêng platform_app (CREATEROLE, BYPASSRLS), KHÔNG phải superuser.
      DATABASE_URL: postgresql://${POSTGRES_USER:-peopleos}:${POSTGRES_PASSWORD:-peopleos_pg_pass}@postgres:5432/${POSTGRES_DB:-peopleos}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_change_me}
      END_USER_REALM: peopleos
      PLATFORM_ISSUER: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}/realms/peopleos-platform
      PLATFORM_JWKS_URL: http://keycloak:8080/realms/peopleos-platform/protocol/openid-connect/certs
      APISIX_ADMIN_URL: http://apisix:9180
      APISIX_ADMIN_KEY: ${APISIX_ADMIN_KEY:-change_me_admin_key}
      HASURA_URL: http://hasura:8080
      HASURA_ADMIN_SECRET: ${HASURA_ADMIN_SECRET:-hasura_admin_secret_change_me}
      PLATFORM_SECRET_KEY: ${PLATFORM_SECRET_KEY:?Đặt PLATFORM_SECRET_KEY (python -c "from cryptography.fernet import Fernet;print(Fernet.generate_key().decode())")}
      EVENT_DISPATCHER_SECRET: ${EVENT_DISPATCHER_SECRET:-event_secret_change_me}
      # CHỈ bật khi chạy smoke test/dev (cho phép webhook tới máy host). Production: để false (chống SSRF)
      ALLOW_PRIVATE_WEBHOOKS: ${ALLOW_PRIVATE_WEBHOOKS:-false}
      ALLOW_HTTP_WEBHOOKS: ${ALLOW_HTTP_WEBHOOKS:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8090:8090"      # Swagger UI: http://localhost:8090/docs (Developer Portal tạm thời)
    depends_on:
      postgres:
        condition: service_healthy
      hasura:
        condition: service_started
    restart: unless-stopped

  platform-worker:
    build:
      context: ../apps/platform/platform-api
    command: ["python", "-m", "platform_api.worker"]
    environment: *platform-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  hasura:
    environment:
      EVENT_DISPATCHER_URL: http://platform-api:8090/internal/hasura-events
      EVENT_DISPATCHER_SECRET: ${EVENT_DISPATCHER_SECRET:-event_secret_change_me}

  developer-portal:
    build:
      context: ../apps/developer-portal
      args:
        VITE_KEYCLOAK_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
        VITE_PLATFORM_API: ${PORTAL_PLATFORM_API:-http://localhost:9080/platform}
        VITE_GATEWAY_URL: ${PORTAL_GATEWAY_URL:-http://localhost:9080}
    ports:
      - "3100:80"
    depends_on:
      - apisix
    restart: unless-stopped

volumes:
  etcd_data:
