apiVersion: v1
kind: Secret
metadata: { name: platform-secrets, namespace: platform-system }
type: Opaque
stringData:
  DATABASE_URL: "postgresql://platform_app:CHANGE_ME@cell-1-pg-pooler-rw.cell-1.svc:5432/peopleos"   # role CREATEROLE + BYPASSRLS, KHÔNG superuser
  KEYCLOAK_ADMIN: "admin"
  KEYCLOAK_ADMIN_PASSWORD: "CHANGE_ME"
  PLATFORM_ISSUER: "https://id.example.com/realms/peopleos-platform"
  PLATFORM_JWKS_URL: "http://keycloak.identity.svc:8080/realms/peopleos-platform/protocol/openid-connect/certs"
  APISIX_ADMIN_KEY: "CHANGE_ME"
  HASURA_ADMIN_SECRET: "CHANGE_ME"
  PLATFORM_SECRET_KEY: "CHANGE_ME_FERNET_KEY"
  EVENT_DISPATCHER_SECRET: "CHANGE_ME"
---
apiVersion: v1
kind: Secret
metadata: { name: cell-1-secrets, namespace: cell-1 }
type: Opaque
stringData:
  owner-db-url: "postgresql://peopleos:CHANGE_ME@cell-1-pg-rw:5432/peopleos"      # CHỈ cho Job db-migrate (không qua PgBouncer)
  hasura-app-password: "CHANGE_ME"                                              # mật khẩu role hasura_app
  data-db-url: "postgresql://hasura_app:CHANGE_ME@cell-1-pg-pooler-rw:5432/peopleos"
  metadata-db-url: "postgresql://peopleos:CHANGE_ME@cell-1-pg-rw:5432/hasura_metadata"
  admin-secret: "CHANGE_ME"
  jwt-secret: '{"jwk_url":"http://keycloak.identity.svc:8080/realms/peopleos/protocol/openid-connect/certs","claims_map":{"x-hasura-allowed-roles":{"path":"$.realm_access.roles"},"x-hasura-default-role":{"path":"$.default_role","default":"employee"},"x-hasura-user-id":{"path":"$.sub"},"x-hasura-tenant-id":{"path":"$.tenant_id"}}}'
  event-dispatcher-secret: "CHANGE_ME"
---
apiVersion: v1
kind: Secret
metadata: { name: gateway-secrets, namespace: gateway }
type: Opaque
stringData:
  admin-key: "CHANGE_ME"
  keyring: "CHANGE_ME_16CHR"
  hasura-admin-secret: "CHANGE_ME"
